# .github/workflows/tests.yml
# CI de subnet-calc : relance pytest sur chaque PR vers main et sur chaque push sur main.
# Le nom du job ("test") est celui à déclarer comme vérification obligatoire dans la règle de protection.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Largeur de terminal fixe : la sortie de --help ne doit pas dépendre de l'environnement.
      COLUMNS: "80"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer pytest
        run: python -m pip install --upgrade pip pytest

      - name: Lancer les tests
        run: python -m pytest tests -q -p no:cacheprovider
