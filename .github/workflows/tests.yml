# .github/workflows/tests.yml
# CI de subnet-calc : relance pytest sur chaque PR vers main et sur chaque push sur main.
# Le nom du job ("test") est celui déclaré comme vérification obligatoire dans la protection de main :
# ne pas le renommer et ne pas le transformer en matrice (une matrice produit "test (80)", etc.).

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer pytest
        run: python -m pip install --upgrade pip pytest

      # La sortie de --help ne doit pas dépendre de la largeur du terminal :
      # la suite est rejouée à plusieurs largeurs (le lab 2 a montré des tests qui ne passaient qu'à 80).
      - name: Lancer les tests à plusieurs largeurs de terminal
        run: |
          status=0
          for cols in 60 80 120 150 210; do
            echo "::group::COLUMNS=$cols"
            COLUMNS=$cols python -m pytest tests -q -p no:cacheprovider || status=1
            echo "::endgroup::"
          done
          exit $status
